# SonarQube — the same standard ESLint enforces locally, reported centrally.
#
# The local gate (eslint-plugin-sonarjs + the two house rules) is the fast feedback loop;
# Sonar is the record. Where they overlap the thresholds are deliberately identical, so a
# change that passes `pnpm verify` does not then fail the server.

sonar.projectKey=reliance-bank
sonar.projectName=Reliance Bank
sonar.projectVersion=1.0.0

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/__tests__/**
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/*.generated.ts,\
  **/.turbo/**

# Generated, declarative or vendored code should not dilute the duplication metric.
sonar.cpd.exclusions=\
  packages/contracts/src/**,\
  packages/mocks/src/**,\
  **/*.schema.ts

sonar.javascript.lcov.reportPaths=\
  packages/money/coverage/lcov.info,\
  packages/contracts/coverage/lcov.info,\
  packages/ui/coverage/lcov.info,\
  apps/api/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Quality gate expectations, mirroring agent_plan.md §2.4.
sonar.coverage.exclusions=\
  **/*.module.ts,\
  **/main.ts,\
  **/index.ts,\
  **/seed/**,\
  **/*.stories.tsx
